name: Release

# Publishes @reposell/proagents-workspace when a v* tag is pushed.
#
# Pipeline (the release checklist's blocking section, automated):
#   full gate → paw check → tag/version/changelog/manifest coherence →
#   bundle → stage → tarball rehearsal (install + smoke ON THE RUNNER) →
#   npm publish → registry verification → cold-install smoke.
#
# Publishing uses npm TRUSTED PUBLISHER (OIDC) — no token, no secret:
#   - the workflow runs with `id-token: write` and the `npm` environment,
#   - npmjs.com → package Settings → Trusted publisher must list exactly:
#     repository EnzoVezzaro/proagents-workspace · workflow release.yml ·
#     environment npm
#   - the environment name must match EXACTLY (case-sensitive); if the
#     npm-side name differs, change it on npm or rename this workflow's
#     `environment:` — a mismatch fails the OIDC claim.
#   - `npm publish --provenance` attests the build's provenance; npm
#     >= 11.5.1 is required on the runner, hence the npm upgrade step.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Gate → rehearse → publish → verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build FIRST (topological order emits the dist/ declarations that
      # typecheck needs on a fresh machine — see ci.yml).
      - name: Build (workspace packages, topological order)
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Integration tests exercise REAL git commits through the repository
      # provider; the runner has no git identity by default.
      - name: Configure git identity for tests
        run: |
          git config --global user.name "Paw CI"
          git config --global user.email "paw-ci@users.noreply.github.com"

      - name: Test
        run: pnpm test

      # Spec section 153: no drift reaches the registry.
      - name: Self-diagnostics (paw check)
        run: node packages/cli/dist/index.js check

      - name: Verify the tagged version is coherent
        run: |
          PKG_VERSION=$(node -p "require('./packages/cli/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION but packages/cli is $PKG_VERSION — the release commit and tag disagree"
            exit 1
          fi
          if ! grep -qF "## [$PKG_VERSION]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no ## [$PKG_VERSION] entry — add it before releasing"
            exit 1
          fi
          if ! grep -qF "version: $PKG_VERSION" install/manifest.yaml; then
            echo "::error::install/manifest.yaml does not carry version $PKG_VERSION (PAW001 would fail)"
            exit 1
          fi
          if npm view "@reposell/proagents-workspace@$PKG_VERSION" version --prefer-online >/dev/null 2>&1; then
            echo "::error::$PKG_VERSION is already on the registry — never republish a version"
            exit 1
          fi
          echo "coherent: tag, packages, changelog, manifest all say $PKG_VERSION; not yet published"

      - name: Bundle the self-contained CLI
        run: pnpm --filter proagents-workspace bundle

      - name: Stage the npm package
        run: pnpm --filter proagents-workspace pack:npm

      # Rehearsal on the runner: pack the stage dir, install the TARBALL
      # into a scratch prefix, smoke the golden path (version + check +
      # file-driven init). Nothing touches the registry yet.
      - name: Rehearse the tarball
        run: |
          cd packages/cli/npm-stage
          TARBALL=$(npm pack | tail -1)
          echo "rehearsal tarball: $TARBALL"
          mkdir -p /tmp/rehearsal && npm install -g --prefix /tmp/rehearsal "./$TARBALL"
          /tmp/rehearsal/bin/paw --version
          /tmp/rehearsal/bin/paw check >/dev/null || true
          SMOKE=$(mktemp -d)
          printf '{"name":"smoke","scripts":{"test":"echo ok"}}\n' > "$SMOKE/package.json"
          printf '# Smoke\n\nA local-first browser application with AI features.\n' > "$SMOKE/README.md"
          cd "$SMOKE"
          /tmp/rehearsal/bin/paw install README.md --json | grep -q '"command": "install"'
          test -f .paw/workspace.yaml
          grep -q 'productType: browser-application' .paw/workspace.yaml
          echo "rehearsal PASSED: golden path works from the tarball"

      - name: Publish to npm (Trusted Publisher, tokenless)
        run: |
          # Tokenless OIDC publish needs npm >= 11.5.1; Node 22 ships npm 10.x.
          npm install -g npm@latest
          npm --version
          cd packages/cli/npm-stage
          npm publish --access public --provenance

      - name: Verify the registry
        run: |
          PKG_VERSION="${GITHUB_REF_NAME#v}"
          # npm Trusted Publishing can take several minutes to propagate to
          # every read replica; poll generously (24 x 30s = 12 min) so a
          # successful publish is not reported as a failure.
          for attempt in $(seq 1 24); do
            LIVE=$(npm view "@reposell/proagents-workspace@$PKG_VERSION" version --prefer-online 2>/dev/null || true)
            if [ "$LIVE" = "$PKG_VERSION" ]; then
              echo "registry confirms $PKG_VERSION after $((attempt - 1)) waits"
              exit 0
            fi
            echo "attempt $attempt/24: registry not yet showing $PKG_VERSION, waiting 30s…"
            sleep 30
          done
          echo "::error::registry never showed $PKG_VERSION after 12 minutes — investigate the publish"
          exit 1

      - name: Cold-install smoke
        run: |
          mkdir -p /tmp/cold && npm install -g --prefix /tmp/cold @reposell/proagents-workspace
          /tmp/cold/bin/paw --version
          echo "cold install PASSED"
